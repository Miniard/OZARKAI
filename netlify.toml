# Configuration Netlify pour Next.js
[build]
  command = "npx prisma generate && npm run build"
  publish = ".next"

# Plugin Next.js officiel de Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Variables d'environnement pour le build
[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"

# Configuration des fonctions serverless
[functions]
  # Répertoire des fonctions (géré automatiquement par le plugin Next.js)
  directory = ".netlify/functions"
  # Timeout des fonctions (max 26s sur plan gratuit, 60s sur Pro)
  timeout = 26

# Redirections pour SPA et API
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/___netlify-handler/:splat"
  status = 200

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Headers pour les assets statiques (cache)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
